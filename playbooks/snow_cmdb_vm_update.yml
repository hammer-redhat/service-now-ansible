---
- name: Create or Update CMDB CI for provisioned VM and raise Change Request
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    snow_ci_class: "cmdb_ci_linux_server"
    snow_assignment_group: "Conditional Script Writer"

  tasks:
    - name: Validate required extra_vars
      ansible.builtin.fail:
        msg: "Required variable '{{ item }}' is not defined or empty."
      when: vars[item] is not defined or vars[item] | string | length == 0
      loop:
        - vm_name
        - vm_ip
        - os_version
        - cpu_cores
        - vm_memory
        - cpu_model

    - name: Check if CMDB CI already exists for this VM
      servicenow.itsm.configuration_item_info:
        query:
          - name: = {{ vm_name }}
            sys_class_name: = {{ snow_ci_class }}
      register: existing_ci

    - name: Set CI action fact
      ansible.builtin.set_fact:
        ci_action: "{{ 'updated' if existing_ci.records | length > 0 else 'created' }}"
        ci_sys_id_existing: "{{ existing_ci.records[0].sys_id if existing_ci.records | length > 0 else '' }}"

    - name: Create or update CMDB CI
      servicenow.itsm.configuration_item:
        sys_id: "{{ ci_sys_id_existing if ci_sys_id_existing else omit }}"
        name: "{{ vm_name }}"
        sys_class_name: "{{ snow_ci_class }}"
        ip_address: "{{ vm_ip }}"
        other:
          host_name: "{{ vm_name }}"
          os_version: "{{ os_version }}"
          cpu_count: "{{ cpu_cores }}"
          cpu_core_count: "{{ cpu_cores }}"
          cpu_type: "{{ cpu_model }}"
          ram: "{{ (vm_memory | regex_replace('Gi$', '') | int * 1024) }}"
          virtual: true
          short_description: "KubeVirt VM provisioned via Terraform on OpenShift"
      register: upserted_ci

    - name: Set CI sys_id fact
      ansible.builtin.set_fact:
        ci_sys_id: "{{ upserted_ci.record.sys_id }}"

    - name: Create Change Request for CMDB update
      servicenow.itsm.change_request:
        state: new
        short_description: "CMDB update for VM {{ vm_name }}"
        description: >-
          {{ ci_action | capitalize }} CMDB CI for virtual machine {{ vm_name }}.
          IP: {{ vm_ip }} | OS: {{ os_version }} | CPU: {{ cpu_cores }} cores | Memory: {{ vm_memory }}
        assignment_group: "{{ snow_assignment_group }}"
        type: "standard"
        category: "Software"
        other:
          cmdb_ci: "{{ ci_sys_id }}"
          work_notes: |
            VM Details:
            - Name: {{ vm_name }}
            - IP Address: {{ vm_ip }}
            - OS: {{ os_version }}
            - CPU Cores: {{ cpu_cores }}
            - Memory: {{ vm_memory }}
            - Namespace: {{ namespace | default('N/A') }}
            - CMDB CI Status: {{ ci_action }}
      register: created_cr

    - name: Publish job artifacts for downstream steps
      ansible.builtin.set_stats:
        data:
          cr_number: "{{ created_cr.record.number }}"
          ci_sys_id: "{{ ci_sys_id }}"
          ci_action: "{{ ci_action }}"

    - name: Display results
      ansible.builtin.debug:
        msg:
          - "CMDB CI: {{ ci_action }} (sys_id: {{ ci_sys_id }})"
          - "Change Request: {{ created_cr.record.number }}"
